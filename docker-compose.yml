services:
  api:
    # Pulled from GitHub Container Registry — published automatically by
    # .github/workflows/docker-publish.yml on every push to main. No local
    # build needed for a normal deployment. Contributing/local-dev builds
    # from source instead via docker-compose.dev.yml — see docs/development.md.
    image: ${MINECRAFTPANEL_IMAGE:-ghcr.io/nicki41/minecontroller:latest}
    container_name: minecraftpanel-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Scheduler workflows run on this clock; it's also passed to every
      # Minecraft container. See .env.example.
      TZ: ${TZ:-UTC}
      # SQLite file lives inside the /data bind mount below, so it's a
      # single self-contained deployment — no separate DB container or
      # credentials to configure. Not overridable via .env on purpose: the
      # path must match the DATA_PATH volume mount for the file to persist.
      DATABASE_URL: file:/data/db.sqlite
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      # Not set here: HOST_DATA_PATH is auto-detected at runtime by
      # self-inspecting this container's own mounts over the Docker socket
      # (see apps/api/src/config/hostDataPath.ts). Only add it below if
      # that detection doesn't work for your setup (rootless Docker,
      # Podman, ...) — see docs/configuration.md.
      # HOST_DATA_PATH: /absolute/path/to/latticore/data
      DATA_PATH: /data
      MINECRAFT_IMAGE: ${MINECRAFT_IMAGE:-itzg/minecraft-server:latest}
      RUNTIME_IMAGE_BASE: ${RUNTIME_IMAGE_BASE:-ghcr.io/nicki41/minecontroller-runtime}
      MINECRAFT_NETWORK: ${MINECRAFT_NETWORK:-minecraftpanel_mc_net}
      MC_PORT_RANGE_MIN: ${MC_PORT_RANGE_MIN:-25565}
      MC_PORT_RANGE_MAX: ${MC_PORT_RANGE_MAX:-25664}
      MODRINTH_API_URL: ${MODRINTH_API_URL:-https://api.modrinth.com/v2}
      MODRINTH_USER_AGENT: ${MODRINTH_USER_AGENT:-latticore/0.1.0 (github.com/nicki41/minecontroller)}
      # Optional — auto-generated and persisted on first boot when left empty.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    # Published directly on the host by default — this is all that's
    # needed to reach the panel at http://<host>:3000. Already behind a
    # reverse proxy (nginx-proxy-manager, Caddy, Traefik, ...)? Comment
    # this out, uncomment the "proxy_net" lines below (in both "networks:"
    # blocks) and point the proxy at "minecraftpanel-api" : 3000 instead —
    # enable its "Websockets Support" toggle, the live console needs it.
    ports:
      - "${PANEL_PORT:-3000}:3000"
    volumes:
      # Server files, uploads, backups, AND the sqlite database itself
      # (db.sqlite, at the top level of this folder) — the whole panel's
      # state lives in this one bind mount. Bind-mounted (not a named
      # volume) so the API's own self-detection (see HOST_DATA_PATH above)
      # can reliably resolve the matching host path when it asks the
      # Docker daemon to bind-mount per-server data into newly created
      # Minecraft containers (see README).
      - ./data:/data
      # Grants the API container control over the host's Docker daemon so it
      # can create/start/stop/inspect Minecraft server containers. This is
      # equivalent to root on the host if the API container is compromised —
      # see README "Docker socket & security" before exposing this panel
      # beyond a trusted, single-tenant, private network.
      - /var/run/docker.sock:/var/run/docker.sock:rw
    networks:
      # So the API can reach each Minecraft container's RCON port by
      # container name over Docker's embedded DNS, without ever publishing
      # RCON to the host. See DockerMinecraftRuntime / RconClient.
      - minecraftpanel_mc_net
      # Reverse-proxy network (e.g. nginx-proxy-manager) — lets that
      # container reach this one by name. Only needed if you commented out
      # "ports:" above; uncomment this together with the proxy_net entry
      # under top-level "networks:" below, and make sure that network
      # already exists on your host (docker network ls).
      # - proxy_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  # Dedicated network for dynamically created Minecraft server containers.
  # Declared here so `docker compose down` can be told to leave it alone if
  # servers are still meant to exist; the API also ensures it exists at boot.
  minecraftpanel_mc_net:
    name: ${MINECRAFT_NETWORK:-minecraftpanel_mc_net}
    driver: bridge
  # Uncomment together with the "api" service's "proxy_net" entry above if
  # you're putting a reverse proxy in front instead of publishing the port
  # directly. Must already exist on the host (e.g. created alongside your
  # nginx-proxy-manager/Traefik/Caddy stack) — this only references it.
  # proxy_net:
  #   external: true
