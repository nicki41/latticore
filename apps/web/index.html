<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Latticore</title>
    <meta name="description" content="Self-hosted panel for Minecraft servers and proxy networks." />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#15151a" />

    <!-- Apple PWA meta tags — iOS ignores the W3C manifest's display/icons
         fields for "Add to Home Screen" and needs these instead. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Latticore" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <!-- Apple splash screens (shown full-screen while the standalone app
         launches, before any JS has run) — one per common iPhone size.
         Best-effort: covers the most common current screens, not every
         iPhone ever made. The in-app #splash overlay below covers the rest
         and every non-iOS visitor. -->
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1170x2532.png"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1179x2556.png"
          media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1284x2778.png"
          media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1290x2796.png"
          media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-750x1334.png"
          media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='8 6 48 52'%3E%3Cpath d='M32 8 L53 20 L32 32 L11 20 Z' fill='%23F5B6D2'/%3E%3Cpath d='M11 20 L32 32 L32 56 L11 44 Z' fill='%23B8286E'/%3E%3Cpath d='M53 20 L32 32 L32 56 L53 44 Z' fill='%23E26AA0'/%3E%3C/svg%3E"
    />
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>

    <!--
      Static (non-React) splash overlay: covers the gap between first paint
      and the app bundle mounting, for every browser (not just iOS's native
      startup-image, which only fires for an installed standalone app).
      Plain HTML/CSS so it renders before any JS executes — main.tsx removes
      it (with a fade) once React has mounted.
    -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#15151a;transition:opacity 200ms ease-out">
      <svg viewBox="0 0 64 64" width="72" height="72" role="img" aria-label="Latticore">
        <g stroke="#F5B6D2" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" fill="none">
          <path d="M32 8 L53 20 L53 44 L32 56 L11 44 L11 20 Z" />
          <path d="M11 20 L32 32 L53 20 M32 32 L32 56" />
        </g>
        <g fill="#E26AA0">
          <circle cx="32" cy="8" r="5" /><circle cx="53" cy="20" r="5" /><circle cx="53" cy="44" r="5" /><circle cx="32" cy="56" r="5" />
          <circle cx="11" cy="44" r="5" /><circle cx="11" cy="20" r="5" /><circle cx="32" cy="32" r="5" />
        </g>
      </svg>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
