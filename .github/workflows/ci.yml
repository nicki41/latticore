name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build -w packages/shared
      - run: npm run -w apps/api prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
