name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A normal run takes about a minute; without this a stuck step holds
    # the runner for GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build -w packages/shared
      - run: npm run -w apps/api prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The production build (Vite + PostCSS for the web app) catches what
      # typecheck can't, e.g. a dependency bump that breaks the CSS pipeline.
      - run: npm run build
