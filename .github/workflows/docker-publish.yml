name: Publish Docker images

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  workflow_dispatch: {}
  # Weekly rebuild even without code changes, so the published images pick
  # up security patches to their base images (Node, Debian, Temurin JRE).
  schedule:
    - cron: "17 4 * * 1"

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/latticore
  RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/latticore-runtime
  # The names from before the rename to Latticore, still published with
  # every build: existing installs pull these (docker-compose.yml/.env from
  # back then) and keep updating without any change on their side.
  LEGACY_API_IMAGE: ghcr.io/${{ github.repository_owner }}/minecontroller
  LEGACY_RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/minecontroller-runtime

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.API_IMAGE }}
            ${{ env.LEGACY_API_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # Base images for panel-managed Minecraft servers (see
  # apps/api/src/minecraft/runtime/runtimeImages.ts) — one per supported
  # Java major. Add a matrix entry here whenever a new one is added there.
  runtime-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        java: [8, 17, 21, 25]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.RUNTIME_IMAGE }}
            ${{ env.LEGACY_RUNTIME_IMAGE }}
          tags: |
            type=raw,value=java${{ matrix.java }},enable={{is_default_branch}}
            type=raw,value=java${{ matrix.java }}-{{sha}}

      - uses: docker/build-push-action@v7
        with:
          context: ./runtime-images
          file: ./runtime-images/java${{ matrix.java }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime-java${{ matrix.java }}
          cache-to: type=gha,mode=max,scope=runtime-java${{ matrix.java }}
