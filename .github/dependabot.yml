# Automated dependency/security update PRs. Grouped so a normal week is one
# PR per ecosystem instead of dozens; security advisories still open their
# own PR immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The CLI and the client must always move together.
      prisma:
        patterns: ["prisma", "@prisma/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors that need a real migration, done as their own change:
      # Prisma 7 (prisma.config.ts + driver adapter), Tailwind 4 (new
      # PostCSS plugin and CSS-based config).
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # Follows the Node runtime (24 LTS in the Docker image and CI), not
      # the newest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: ["/", "/runtime-images/java8", "/runtime-images/java17", "/runtime-images/java21", "/runtime-images/java25"]
    schedule:
      interval: weekly
    # The major IS the point of each image (java8 must stay Java 8, Node
    # stays on its LTS line) — base-image patches arrive via the weekly
    # rebuild in docker-publish.yml instead.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
